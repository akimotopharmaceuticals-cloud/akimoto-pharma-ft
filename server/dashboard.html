<style>
:root{--bg:#F4F3EF;--surface:#fff;--sunk:#F7F6F2;--ink:#1A1814;--muted:#6B665D;--line:#E2DED5;--brand:#1E1B16;--accent:#D89E2E;
--ok:#24804F;--ok-soft:#DDF1E5;--warn:#A86B0C;--warn-soft:#FBEBCF;--bad:#BF2F2F;--bad-soft:#F8DEDE;--idle:#7A8682;
--display:"Familjen Grotesk",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--brand);color:#fff}
header h1{font:700 1.2rem var(--display);margin:0;display:flex;align-items:center;gap:10px}
header h1 img{width:30px;height:30px}
header h1 small{font:600 .72rem var(--body);letter-spacing:.12em;color:var(--accent);display:block}
.selfie{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer;flex:none}
.dhead{display:flex;gap:12px;align-items:flex-start}
header .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,button{font:inherit}
input[type=date]{padding:6px 8px;border-radius:8px;border:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent)}
main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px 16px;height:calc(100vh - 62px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;min-height:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.kpi b{display:block;font:700 1.4rem var(--display)}
.kpi span{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.mr{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:4px}
.mr:hover{background:var(--sunk)} .mr.sel{background:#F6EBD4}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.active{color:var(--ok);background:var(--ok-soft)} .silent{color:var(--warn);background:var(--warn-soft)}
.ended,.notstarted{color:var(--idle);background:var(--sunk)}
.muted{color:var(--muted)} .small{font-size:.82rem} .mono{font-family:var(--mono);font-size:.8rem}
.flag{font-size:.8rem;padding:2px 0} .flag.bad{color:var(--bad)} .flag.warn{color:var(--warn)}
.right{display:grid;grid-template-rows:minmax(300px,1.3fr) 1fr;gap:14px;min-height:0}
#map{border-radius:14px;border:1px solid var(--line);min-height:300px}
.detail{padding:14px}
.detail h2{font:700 1.1rem var(--display);margin:0 0 4px}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:10px}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{padding:24px;text-align:center;color:var(--muted)}
#login{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:10px}
#login input{padding:10px;border:1px solid var(--line);border-radius:8px}
.tabs{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:#fff;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--brand)}
#approvalsView{padding:14px 16px;display:grid;gap:14px}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.sect h2{font:700 1.1rem var(--display);margin:0}
.item{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:760px}
.cal div{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.74rem;min-height:44px;overflow:hidden}
.cal div b{display:block;font-family:var(--mono);font-size:.72rem}
.cal .off{background:var(--sunk);color:var(--muted)} .cal .dh{border:0;min-height:0;text-align:center;color:var(--muted);font-weight:600}
.decide{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.decide input{flex:1;min-width:180px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff} .btn.ret{color:var(--bad)}
.st{font-weight:600} .st.Approved{color:var(--ok)} .st.Returned{color:var(--bad)} .st.Pending{color:var(--warn)}
.exp{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;align-items:start}
.filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#billModal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:2000}
#billModal img{max-width:92vw;max-height:88vh;border-radius:8px;background:#fff}
@media (max-width:860px){.exp{grid-template-columns:1fr}}
@media (max-width:860px){main{grid-template-columns:1fr;height:auto}.right{grid-template-rows:380px auto}}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = ts => ts ? new Date(ts).toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit", timeZone:"Asia/Kolkata"}) : "—";
let key = ""; try { key = localStorage.getItem("ftKey") || ""; } catch (e) {}
let data = null, sel = null, map, layer;
const todayIST = () => new Date(Date.now() + 5.5*3600e3).toISOString().slice(0,10);
const statusLbl = {active:"Active", silent:"No signal", ended:"Day ended", notstarted:"Not started"};

async function api(path) {
  const r = await fetch(path, {headers: {"X-Api-Key": key}});
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) throw new Error("Server error " + r.status);
  return r;
}
async function load() {
  try {
    data = await (await api("/api/state?date=" + $("#date").value)).json();
    $("#updated").textContent = "Updated " + t(Date.now());
    render();
  } catch (e) {
    if (e.message === "auth") return showLogin("That access key was not accepted.");
    $("#updated").textContent = "Could not refresh: " + e.message;
  }
}
function showLogin(err) { $("#app").hidden = true; $("#login").hidden = false; $("#loginErr").textContent = err || ""; }
function showApp() {
  $("#login").hidden = true; $("#app").hidden = false;
  if (!map) {
    map = L.map("map").setView([26.8467, 80.9462], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 50);
  load();
  loadApprovals();
}
function render() {
  const m = data.mrs;
  const active = m.filter(x => x.status === "active").length;
  const calls = m.reduce((s, x) => s + x.calls, 0), ver = m.reduce((s, x) => s + x.verified, 0);
  const flags = m.reduce((s, x) => s + x.flags.length, 0);
  $("#kpis").innerHTML = [["Active", `${active}/${m.length}`], ["Calls", calls], ["Verified", calls ? Math.round(ver/calls*100) + "%" : "—"], ["Alerts", flags]]
    .map(([l, v]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#list").innerHTML = m.length ? m.map(x => `
    <div class="mr ${x.code === sel ? "sel" : ""}" data-code="${esc(x.code)}">
      <div class="row"><b>${esc(x.name)} <span class="muted small">${esc(x.code)}</span></b><span class="pill ${x.status}">${statusLbl[x.status]}</span></div>
      <div class="small muted">${x.calls} calls (${x.verified} verified) · ${x.km} km · last ${t(x.last && x.last.ts)}${x.battery != null ? " · 🔋" + x.battery + "%" : ""}</div>
      ${x.flags.slice(0, 3).map(f => `<div class="flag ${f.sev}">⚠ ${esc(f.text)}</div>`).join("")}
    </div>`).join("") : `<div class="empty">No MR has synced yet. Install the app, add this server in Settings and start a day.</div>`;
  drawMap();
  renderDetail();
}
function colorOf(x) { return {active:"#24804F", silent:"#A86B0C", ended:"#7A8682", notstarted:"#7A8682"}[x.status]; }
function drawMap() {
  layer.clearLayers();
  const bounds = [];
  for (const x of data.mrs) {
    if (sel && x.code !== sel) continue;
    if (x.route.length > 1) L.polyline(x.route.map(p => [p[0], p[1]]), {color: x.code === sel ? "#D89E2E" : "#1E1B16", weight: 3, opacity: .8}).addTo(layer);
    x.route.forEach(p => bounds.push([p[0], p[1]]));
    for (const v of x.visits) {
      const c = v.mock || (v.dist_m > 150) ? "#BF2F2F" : "#24804F";
      L.circleMarker([v.lat, v.lng], {radius: 7, color: "#fff", weight: 2, fillColor: c, fillOpacity: 1})
        .bindPopup(`<b>${esc(v.doctor)}</b><br>${esc(v.speciality)} · ${esc(v.area)}<br>${t(v.ts)} · ${v.dist_m < 0 ? "first visit (pinned)" : Math.round(v.dist_m) + " m from clinic"}${v.mock ? "<br><b style='color:#BF2F2F'>Fake GPS</b>" : ""}`).addTo(layer);
      bounds.push([v.lat, v.lng]);
    }
    if (x.last) {
      L.circleMarker([x.last.lat, x.last.lng], {radius: 10, color: "#fff", weight: 3, fillColor: colorOf(x), fillOpacity: 1})
        .bindTooltip(x.name.split(" ")[0], {permanent: true, direction: "right", offset: [10, 0]}).addTo(layer);
      bounds.push([x.last.lat, x.last.lng]);
    }
  }
  if (bounds.length) map.fitBounds(bounds, {padding: [30, 30], maxZoom: 15});
}
let selfieCache = {};
async function loadSelfie(file) {
  const img = document.getElementById("selfieImg"); if (!img) return;
  try {
    if (!selfieCache[file]) selfieCache[file] = URL.createObjectURL(await (await api("/api/bill?file=" + encodeURIComponent(file))).blob());
    img.src = selfieCache[file];
    img.onclick = () => { $("#billImg").src = selfieCache[file]; $("#billModal").hidden = false; };
  } catch (e) { img.remove(); }
}
function renderDetail() {
  const x = data.mrs.find(m => m.code === sel);
  if (!x) { $("#detail").innerHTML = `<div class="empty">Select an MR to see the day's route and calls.</div>`; return; }
  $("#detail").innerHTML = `
    <div class="dhead">${x.selfie ? `<img class="selfie" id="selfieImg" alt="Start-of-day selfie" title="Start-of-day selfie">` : ""}<div style="flex:1;min-width:0">
    <div class="row"><h2>${esc(x.name)} <span class="muted small">${esc(x.code)}</span></h2><span class="pill ${x.status}">${statusLbl[x.status]}</span></div>
    <div class="small muted">Day ${t(x.dayStart)} – ${x.dayEnd ? t(x.dayEnd) + (x.autoEnded ? " (auto)" : "") : "open"} · ${x.km} km by GPS · ${esc(x.model || "")}</div></div></div>
    ${x.flags.map(f => `<div class="flag ${f.sev}">⚠ ${esc(f.text)}</div>`).join("")}
    ${x.visits.length ? `<table><thead><tr><th>Time</th><th>Doctor</th><th>Products · samples</th><th>Location</th><th>Feedback</th></tr></thead><tbody>
      ${x.visits.map(v => `<tr><td class="mono">${t(v.ts)}</td><td><b>${esc(v.doctor)}</b><div class="small muted">${esc(v.speciality)} · ${esc(v.area)}</div></td>
      <td class="small">${esc(v.products)}<div class="muted">${esc(v.samples)}${v.rx ? " · Rx " + v.rx + "/wk" : ""}</div></td>
      <td class="small">${v.mock ? '<span class="flag bad">Fake GPS</span>' : v.dist_m < 0 ? "Pinned (first visit)" : v.verified ? `<span style="color:var(--ok)">✓ ${Math.round(v.dist_m)} m</span>` : `<span class="flag bad">${Math.round(v.dist_m)} m away</span>`}<div class="muted">±${Math.round(v.acc)} m</div></td>
      <td class="small">${esc(v.feedback)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No calls reported on this day.</div>`}`;
  if (x.selfie) loadSelfie(x.selfie);
}
$("#list").addEventListener("click", e => { const r = e.target.closest(".mr"); if (!r) return; sel = sel === r.dataset.code ? null : r.dataset.code; render(); });
$("#go").addEventListener("click", () => { key = $("#key").value.trim(); try { localStorage.setItem("ftKey", key); } catch (e) {} showApp(); });
$("#key").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });
$("#refresh").addEventListener("click", load);
$("#date").addEventListener("change", () => { sel = null; load(); });
$("#csv").addEventListener("click", async () => {
  try {
    const blob = await (await api("/api/export.csv?date=" + $("#date").value)).blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `AkimotoFT_${$("#date").value}.csv`; a.click();
  } catch (e) { alert("Download failed: " + e.message); }
});
// ---------- approvals ----------
let appr = null;
const rs = n => "₹" + Math.round(n).toLocaleString("en-IN");
async function loadApprovals() {
  try {
    appr = await (await api("/api/approvals")).json();
    const waiting = appr.expenses.filter(e => e.status === "Pending").length + appr.tours.filter(t => t.status === "Pending").length;
    $("#tabAppr").textContent = waiting ? `Approvals (${waiting})` : "Approvals";
    renderApprovals();
  } catch (e) { if (e.message === "auth") showLogin("That access key was not accepted."); }
}
function decideBox(kind, key) {
  return `<div class="decide"><input placeholder="Note to the MR (needed to return)" data-note="${esc(key)}">
    <button class="btn ok" data-kind="${kind}" data-key="${esc(key)}" data-st="Approved">Approve</button>
    <button class="btn ret" data-kind="${kind}" data-key="${esc(key)}" data-st="Returned">Return</button></div>`;
}
function renderApprovals() {
  if (!appr) return;
  const r = appr.rules;
  $("#rulesLine").textContent = `Rates: DA HQ ${rs(r.da_hq)} · Ex-HQ ${rs(r.da_exhq)} · Outstation ${rs(r.da_out)} · TA ₹${r.ta_per_km}/km · open days close at ${r.day_end_hour}:00 (change these in the server settings).`;
  const ef = $("#expFilter").value, month = $("#expMonth").value;
  const ex = appr.expenses.filter(e => (ef === "all" || e.status === ef) && (ef !== "all" || !month || e.date.startsWith(month)));
  $("#expList").innerHTML = ex.length ? ex.map(e => `<div class="item">
    <div class="exp">
      <div><b>${esc(e.name)}</b> <span class="muted small">${esc(e.mr)}</span><div class="small">${esc(e.date)} · <span class="st ${e.status}">${e.status}</span>${e.note ? ` · "${esc(e.note)}"` : ""}</div></div>
      <div class="small">DA ${esc(e.da_type)} ${rs(e.da)}<br>TA ${e.km.toFixed(1)} km × ₹${e.rate} = ${rs(e.ta)}<div class="muted">GPS on server: ${e.gps_km} km</div></div>
      <div class="small">${e.other ? `Other ${rs(e.other)} · ${esc(e.other_note)}` : "No other expenses"}${e.bill ? `<br><a href="#" data-bill="${esc(e.bill)}">View bill photo</a>` : ""}</div>
      <div style="font:700 1.2rem var(--display)">${rs(e.total)}</div>
    </div>
    ${e.flags.map(f => `<div class="flag bad">⚠ ${esc(f)}</div>`).join("")}
    ${e.status === "Pending" ? decideBox("expense", e.key) : ""}
  </div>`).join("") : `<div class="empty">No claims ${ef === "Pending" ? "waiting" : "for this month"}.</div>`;

  const tf = $("#tourFilter").value;
  const tours = appr.tours.filter(t => tf === "all" || t.status === tf);
  $("#tourList").innerHTML = tours.length ? tours.map(t => {
    const [y, m] = t.month.split("-").map(Number);
    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const label = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString("en-IN", {month: "long", year: "numeric", timeZone: "UTC"});
    const cells = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="dh">${d}</div>`).join("") +
      Array.from({length: first}, () => `<div class="dh"></div>`).join("") +
      Array.from({length: days}, (_, i) => { const a = t.days[i + 1] || "—"; const off = /Sunday off|Leave|Holiday/.test(a);
        return `<div class="${off ? "off" : ""}"><b>${i + 1}</b>${esc(a)}</div>`; }).join("");
    return `<div class="item"><div><b>${esc(t.name)}</b> <span class="muted small">${esc(t.mr)}</span> · ${label} · <span class="st ${t.status}">${t.status}</span>${t.note ? ` · "${esc(t.note)}"` : ""}</div>
      <div class="cal">${cells}</div>${t.status === "Pending" ? decideBox("tour", t.key) : ""}</div>`;
  }).join("") : `<div class="empty">No tour plans ${tf === "Pending" ? "waiting" : "yet"}.</div>`;
}
$("#approvalsView").addEventListener("click", async e => {
  const b = e.target.closest("[data-st]");
  if (b) {
    const note = (document.querySelector(`[data-note="${CSS.escape(b.dataset.key)}"]`) || {}).value || "";
    if (b.dataset.st === "Returned" && !note.trim()) { alertBox("Write a note saying what the MR should change, then tap Return."); return; }
    b.disabled = true;
    try {
      const r = await fetch("/api/decide", {method: "POST", headers: {"X-Api-Key": key, "Content-Type": "application/json"},
        body: JSON.stringify({kind: b.dataset.kind, key: b.dataset.key, status: b.dataset.st, note})});
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      await loadApprovals();
    } catch (err) { b.disabled = false; alertBox("Could not save: " + err.message); }
    return;
  }
  const bill = e.target.closest("[data-bill]");
  if (bill) {
    e.preventDefault();
    try {
      const blob = await (await api("/api/bill?file=" + encodeURIComponent(bill.dataset.bill))).blob();
      $("#billImg").src = URL.createObjectURL(blob); $("#billModal").hidden = false;
    } catch (err) { alertBox("Could not open the bill: " + err.message); }
  }
});
$("#billModal").addEventListener("click", () => { $("#billModal").hidden = true; });
function alertBox(msg) { $("#updated").textContent = msg; window.alert(msg); }
$("#expFilter").addEventListener("change", renderApprovals);
$("#expMonth").addEventListener("change", renderApprovals);
$("#tourFilter").addEventListener("change", renderApprovals);
$("#expCsv").addEventListener("click", async () => {
  const m = $("#expMonth").value || todayIST().slice(0, 7);
  try {
    const blob = await (await api("/api/expenses.csv?month=" + m)).blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `AkimotoFT_expenses_${m}.csv`; a.click();
  } catch (e) { alertBox("Download failed: " + e.message); }
});
function showTab(t) {
  $("#tabMap").classList.toggle("on", t === "map"); $("#tabAppr").classList.toggle("on", t === "appr");
  document.querySelector("main").hidden = t !== "map"; $("#approvalsView").hidden = t !== "appr";
  $("#date").hidden = $("#refresh").hidden = $("#csv").hidden = t !== "map";
  if (t === "map") setTimeout(() => map && map.invalidateSize(), 50); else loadApprovals();
}
$("#tabMap").addEventListener("click", () => showTab("map"));
$("#tabAppr").addEventListener("click", () => showTab("appr"));
$("#expMonth").value = todayIST().slice(0, 7);
setInterval(() => { if (!$("#app").hidden) loadApprovals(); }, 120000);

$("#date").value = todayIST();
setInterval(() => { if (!$("#app").hidden && $("#date").value === todayIST()) load(); }, 60000);
key ? showApp() : showLogin();
</script>
