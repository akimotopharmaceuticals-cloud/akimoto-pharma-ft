name: Build and test Akimoto Pharma FT

on: [push, workflow_dispatch]

jobs:
  # 1. Compile, unit-test, lint and build the signed APK
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (distance and day-end rules)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Android lint report
        run: gradle :app:lintRelease --no-daemon

      - name: Name the APK with its version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "AkimotoPharmaFT-v${VERSION}.apk"
          mkdir -p qa-apk && cp app/build/outputs/apk/release/app-release.apk qa-apk/app.apk
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload the APK for phones
        uses: actions/upload-artifact@v4
        with:
          name: AkimotoPharmaFT-v${{ env.VERSION }}
          path: android/AkimotoPharmaFT-v*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qa-apk
          path: android/qa-apk/app.apk
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-and-lint-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.html
          retention-days: 14

  # 2. Install the APK on a real Android 14 emulator and walk through every screen
  emulator-qa:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: qa-apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator QA (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: python3 qa/emulator_qa.py --apk qa-apk/app.apk --out qa-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots-and-logs
          path: qa-output
          retention-days: 14
